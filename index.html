<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./camellia-profile.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Camellia AI — Assistant of M R S</title>
    <meta name="description" content="Camellia AI, the interactive assistant of M R S — multi-provider SSE streaming across Gemini, Anthropic, and OpenRouter with live search grounding, math, code, and voice." />
    <meta property="og:title" content="Camellia AI — Assistant of M R S" />
    <meta property="og:description" content="Camellia AI, the interactive assistant of M R S — multi-provider SSE streaming with live search grounding, multimodal support, and voice." />
    <meta property="og:image" content="./assets/young_sweet_girl_1787078669904-jjixDzch.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossOrigin="anonymous" />
  </head>
  <body class="bg-[#080C14] text-slate-100 antialiased selection:bg-teal-500/30 selection:text-teal-200">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) {
            r.unregister();
          }
        });
      }

      (function () {
        var handled = false;
        var fallbackTimer = null;

        function isAppMounted() {
          var root = document.getElementById('root');
          return Boolean(
            window.__CAMELLIA_MOUNTED__ ||
            (root && root.childElementCount > 0)
          );
        }

        function renderFallbackNotice(reason) {
          var root = document.getElementById('root');
          if (!root || isAppMounted()) return;

          var isFileProtocol = window.location.protocol === 'file:';
          var subtitle = isFileProtocol
            ? 'Opening <code>index.html</code> directly via <code>file://</code> is blocked by browser ES module security.'
            : 'The browser loaded uncompiled <code>index.html</code> from the repository root instead of the built Vite bundle in <code>dist/</code>.';

          var detail = reason
            ? '<p style="margin:0 0 14px;padding:10px 12px;border-radius:10px;background:#111115;border:1px solid #27272a;font-size:12px;color:#fca5a5;">' + reason + '</p>'
            : '';

          root.innerHTML = [
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#080C14;color:#f1f5f9;font-family:Plus Jakarta Sans,system-ui,-apple-system,sans-serif;">',
              '<div style="max-width:520px;width:100%;border:1px solid rgba(255,255,255,0.12);background:#0E1522;border-radius:16px;padding:28px;line-height:1.6;box-shadow:0 20px 50px rgba(0,0,0,0.45);">',
                '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">',
                  '<span style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;background:rgba(45,212,191,0.14);border:1px solid rgba(45,212,191,0.35);color:#5eead4;font-weight:700;font-size:15px;">C</span>',
                  '<h1 style="margin:0;font-size:18px;font-weight:700;letter-spacing:-0.01em;">Camellia AI needs a Vite build</h1>',
                '</div>',
                '<p style="margin:0 0 14px;font-size:14px;color:#94a3b8;">' + subtitle + '</p>',
                detail,
                '<div style="font-size:13px;color:#cbd5e1;background:#080C14;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px 16px;margin-bottom:18px;">',
                  '<div style="font-weight:600;color:#f4f4f5;margin-bottom:8px;">How to launch properly:</div>',
                  '<ol style="margin:0;padding-left:18px;display:grid;gap:6px;">',
                    '<li>For <strong>GitHub Pages</strong>, ensure <code style="color:#5eead4;">.github/workflows/deploy-pages.yml</code> runs (and remove any default <code style="color:#5eead4;">static.yml</code> workflow deploying raw root files).</li>',
                    '<li>For <strong>local or static hosting</strong>, run <code style="color:#5eead4;">npm run build</code> and serve the compiled <code style="color:#5eead4;">dist/</code> directory (or run <code style="color:#5eead4;">npm run dev</code>).</li>',
                  '</ol>',
                '</div>',
                '<div style="display:flex;flex-wrap:wrap;gap:10px;">',
                  '<button type="button" onclick="window.location.reload()" style="padding:9px 16px;border-radius:10px;border:none;background:#14b8a6;color:#042f2e;font-weight:600;font-size:13px;cursor:pointer;">Reload Page</button>',
                  '<a href="./dist/" style="padding:9px 16px;border-radius:10px;border:1px solid #2e2e36;background:#1c1c22;color:#e4e4e7;font-weight:500;font-size:13px;text-decoration:none;">Open ./dist/ Build</a>',
                '</div>',
              '</div>',
            '</div>'
          ].join('');
        }

        function handleUnmountedApp(reason) {
          if (handled || isAppMounted()) return;
          handled = true;

          if (fallbackTimer) {
            clearTimeout(fallbackTimer);
            fallbackTimer = null;
          }

          if (/\/dist(\/|$)/.test(window.location.pathname) || window.location.protocol === 'file:') {
            renderFallbackNotice(reason);
            return;
          }

          fetch('./dist/index.html', { cache: 'no-store' })
            .then(function (res) {
              if (!res.ok) throw new Error('no-dist');
              return res.text();
            })
            .then(function (html) {
              if (html && html.indexOf('./assets/') !== -1) {
                window.location.replace('./dist/' + window.location.search + window.location.hash);
              } else {
                renderFallbackNotice(reason);
              }
            })
            .catch(function () {
              renderFallbackNotice(reason);
            });
        }

        window.__camelliaBootFail = function () {
          handleUnmountedApp('Failed to load the application module script (browsers cannot execute uncompiled .tsx files directly).');
        };

        window.addEventListener('error', function (event) {
          var target = event && event.target;
          if (target && target.tagName === 'SCRIPT' && target.type === 'module') {
            handleUnmountedApp('Module entry script failed to load or execute.');
          }
        }, true);

        window.addEventListener('DOMContentLoaded', function () {
          if (isAppMounted()) return;
          fallbackTimer = setTimeout(function () {
            if (!isAppMounted()) {
              handleUnmountedApp('');
            }
          }, 4500);
        });

        window.addEventListener('load', function () {
          setTimeout(function () {
            if (!isAppMounted()) {
              handleUnmountedApp('');
            }
          }, 1200);
        });
      })();
    </script>
    <script type="module" src="./src/main.tsx" onerror="window.__camelliaBootFail && window.__camelliaBootFail()"></script>
  </body>
</html>
